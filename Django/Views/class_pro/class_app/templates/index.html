<table border="1" cellpadding="5">
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
        <th>Action</th>
    </tr>
    {% for i in data %}
    <tr>
        <td>{{i.id}}</td>
        <td>{{i.name}}</td>
        <td>{{i.age}}</td>
        <td>{{i.city}}</td>
        <td>
            <a href="{% url 'update' i.id %}">Update</a>
            <a href="{% url "delete" i.id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table><br>
<b><a href="{% url 'add' %}">Add</a></b>
