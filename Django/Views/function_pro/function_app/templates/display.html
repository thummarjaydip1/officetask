<h1>Display Student</h1><br><br>

<table border="1" cellpadding="5">
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
        <th>Action</th>
    </tr>
    
    {% for i in students %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.name}}</td>
            <td>{{i.age}}</td>
            <td>{{i.city}}</td>
            <td>
                <a href="{% url 'update' i.id %}">Update</a>
                <a href="{% url 'delete' i.id %}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
    {% endfor %}
</table>
<br>
<b><a href="{% url 'home' %}">Home</a><br><br></b>
