{% if request.user.is_autheticated %}
<h2>Hello, {{user}}</h2>

<br><br>

<h2>List of Users</h2>

<br>

<table border="1" cellpadding="10">

    <tr>
        <th>Id</th>
        <th>Username</th>
        <th>Password</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
    </tr>

    {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.username}}</td>
            <td>{{i.password}}</td>
            <td>{{i.email}}</td>
            <td>{{i.phone}}</td>
            <td>{{i.address}}</td>
        </tr>
    {% endfor %}

<table>

<br><br>

<a href="{% url "logout" %}">Logout</a>
{% else %}

<a href="{% url "login" %}">Login</a>

{% endif %}
