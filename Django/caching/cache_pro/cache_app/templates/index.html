<h2>List of student</h2>

<table border='1' cellpadding="10">

    <tr>

        <th>Id</th>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>

    </tr>

    {% for i in student %}
    
        <tr>

            <td>{{i.id}}</td>
            <td>{{i.name}}</td>
            <td>{{i.age}}</td>
            <td>{{i.city}}</td>

        </tr>
    
    {% endfor %}

</table>
