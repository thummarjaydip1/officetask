<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            /* Soft professional background */
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            font-family: 'Segoe UI', sans-serif;
        }

        /* CARD */
        .profile-card {
            width: 430px;
            border-radius: 20px;
            overflow: hidden;

            background: #ffffff;

            box-shadow: 0 20px 50px rgba(0,0,0,0.15);

            transition: 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
        }

        /* HEADER */
        .profile-header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            padding: 35px;
            text-align: center;
            color: white;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: white;

            margin: auto;
            margin-bottom: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;
            color: #1e40af;
        }

        .profile-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .profile-header small {
            opacity: 0.85;
        }

        /* BODY */
        .profile-body {
            padding: 25px;
        }

        .info-box {
            display: flex;
            justify-content: space-between;
            padding: 14px 15px;
            margin-bottom: 12px;

            border-radius: 12px;

            background: #f8fafc;
            border: 1px solid #e5e7eb;

            transition: 0.25s;
        }

        .info-box:hover {
            background: #eef2ff;
            border-color: #c7d2fe;
            transform: scale(1.02);
        }

        .label {
            color: #6b7280;
            font-weight: 600;
        }

        .value {
            color: #111827;
            font-weight: 700;
        }

        .badge-id {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
        }

        /* BUTTON */
        .footer {
            text-align: center;
            padding: 20px;
        }

        .btn-custom {
            background: #2563eb;
            color: white;
            border: none;

            padding: 10px 28px;
            border-radius: 10px;

            font-weight: 600;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37,99,235,0.3);
        }

    </style>
</head>

<body>

<div class="profile-card">

    <div class="profile-header">

        <div class="avatar">
            {{data.username|slice:":1"}}
        </div>

        <h3>{{data.username}}</h3>
        <small>Profile Dashboard</small>
    </div>

    <div class="profile-body">

        <div class="info-box">
            <span class="label">ID</span>
            <span class="badge-id">{{data.id}}</span>
        </div>

        <div class="info-box">
            <span class="label">Username</span>
            <span class="value">{{data.username}}</span>
        </div>

        <div class="info-box">
            <span class="label">Email</span>
            <span class="value">{{data.email}}</span>
        </div>

    </div>

    <div class="footer">
        <a href="{% url "user_update" data.id %}" class="btn btn-custom">
            Edit Profile
        </a>
    </div>

</div>

</body>
</html>
