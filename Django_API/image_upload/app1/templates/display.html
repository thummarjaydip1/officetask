<h3>display data</h3>
<table border="1">
    <tr>
        <th>name</th>
        <th>image</th>
    </tr>
    {% for i in data %}
        <tr>
            <td>{{i.name}}</td>
            <td><img src="{{i.image.url}}" width="100" height="100"/></td>
        <tr>
    {% endfor %}
</table>
<h3><a href="{% url "add_data" %}">Add Data</a></h3>
