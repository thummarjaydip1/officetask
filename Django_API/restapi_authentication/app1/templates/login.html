<form method="POST">
  {% csrf_token %}
  <input
    type="text"
    name="username"
    placeholder="Enter username"
    required
  /><br /><br />
  <input
    type="password"
    name="password"
    placeholder="Enter password"
    required
  /><br /><br />
  <button type="submit">Login</button>
</form>
