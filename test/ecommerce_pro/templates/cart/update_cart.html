<center>
<h2> Update Cart Item</h2>

<form method="POST">
    {% csrf_token %}

    <h4>Product Image</h4>
    <img src="{{cart.product.image.url}}" width="150" />
    <h4>Product Name: {{cart.product.name}}</h4>
    <h4>Product Price: {{cart.product.price}}</h4>
    
    <input type="number" value="{{cart.quantity}}" name="quantity" placeholder="Enter Product Quantity" /><br><br>

    <button type="submit">Add To Cart</button>

</form>
</center>
