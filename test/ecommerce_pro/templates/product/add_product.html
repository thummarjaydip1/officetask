<h2>Add Product</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <p>Enter Product Name:</p><br>
    <input type="text" name="name" placeholder="Enter product Name" required><br><br>
    
    <p>Enter Product Description:</p><br>
    <textarea name="description" placeholder="Enter Product Description" required></textarea>

    <p>Enter Product Price:</p><br>
    <input type="number" name="price" placeholder="Enter Product Price" required><br><br>

    <p>Enter Product Image:</p><br>
    <input type="file" name="image" required><br><br>

    <button type="submit">Add Product</button>

</form>
