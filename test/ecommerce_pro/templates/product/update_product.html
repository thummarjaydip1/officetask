<h2>Update Product</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <p>Enter Product Name:</p><br>
    <input type="text" value="{{product.name}}" name="name" placeholder="Enter product Name" required><br><br>
    
    <p>Enter Product Description:</p><br>
    <textarea name="description" placeholder="Enter Product Description" required>{{product.description}}</textarea>

    <p>Enter Product Price:</p><br>
    <input type="number" value="{{product.price}}" name="price" placeholder="Enter Product Price" required><br><br>

    <p>Enter Product Image:</p><br>
    <input type="file" name="image" value="{{product.image}}" required><br><br>

    <button type="submit">Add Product</button>

</form>
