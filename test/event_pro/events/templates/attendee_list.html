<h2>Attendee List</h2>
<table border="1" cellpadding="10">
    <tr>
        <th>Id</th>
        <th>User</th>
        <th>Event</th>
        <th>Action</th>
    </tr>
    {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.user}}</td>
            <td>{{i.event}}</td>
            <td>
                <a href="{% url 'update_attendee' i.id %}"><button>Update Attendee</button></a>
                <a href="{% url 'delete_attendee' i.id %}" onclick="return confirm('Are you sure?')"><button>Delete Attendee</button></a>
            </td>
        </tr>
    {% endfor %}
</table>
<br>
<a href="{% url "index" %}">Home</a>
