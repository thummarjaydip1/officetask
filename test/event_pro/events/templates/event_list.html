<h2>Event List</h2>
<table border="1" cellpadding="10">
    <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Description</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>Location</th>
        <th>User</th>
        <th>Action</th>
    </tr>
    {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.title}}</td>
            <td>{{i.description}}</td>
            <td>{{i.start_time}}</td>
            <td>{{i.end_time}}</td>
            <td>{{i.location}}</td>
            <td>{{i.user}}</td>
            <td>
                <a href="{% url 'detail_event' i.id %}"><button>Detail Event</button></a>
                <a href="{% url 'update_event' i.id %}"><button>Update Event</button></a>
                <a href="{% url 'delete_event' i.id %}" onclick="return confirm('Are you sure?')"><button>Delete Delete</button></a>
            </td>
        </tr>
    {% endfor %}
</table>
<br>
<a href="{% url "index" %}">Home</a>
