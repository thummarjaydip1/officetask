<h2>Session List</h2>
<table border="1" cellpadding="10">
    <tr>
        <th>Id</th>
        <th>Title</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>Event</th>
        <th>Action</th>
    </tr>
    {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.title}}</td>
            <td>{{i.start_time}}</td>
            <td>{{i.end_time}}</td>
            <td>{{i.event}}</td>
            <td>
                <a href="{% url 'update_session' i.id %}"><button>Update Session</button></a>
                <a href="{% url 'delete_session' i.id %}" onclick="return confirm('Are you sure?')"><button>Delete Session</button></a>
            </td>
        </tr>
    {% endfor %}
</table>
<br>
<a href="{% url "index" %}">Home</a>
