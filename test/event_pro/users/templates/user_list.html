<h2>User List</h2>
<table border="1" cellpadding="10">
    <tr>
        <th>Id</th>
        <th>Email</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Action</th>
    </tr>
    {% for i in data %}
        <tr>
            <td>{{i.id}}</td>
            <td>{{i.email}}</td>
            <td>{{i.first_name}}</td>
            <td>{{i.last_name}}</td>
            <td>
                <a href="{% url 'update_user' i.id %}"><button>Update User</button></a>
                <a href="{% url 'delete_user' i.id %}" onclick="return confirm('Are you sure?')"><button>Delete User</button></a>
            </td>
        </tr>
    {% endfor %}
</table>
<br>
<a href="{% url "index" %}">Home</a>
